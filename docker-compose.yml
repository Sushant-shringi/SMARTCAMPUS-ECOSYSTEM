version: '3.8'

services:
  # 1. Attendance & Campus Academic Service (SmartAttend Core)
  attendance-service:
    build:
      context: ./services/attendance-service
      dockerfile: Dockerfile
    container_name: smartcampus-attendance
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./smartattend.db
      - JWT_SECRET=smartcampus_super_secure_jwt_secret_key_2026
      - CORS_ORIGINS=*
    volumes:
      - attendance-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Career & Placement AI Service (RAG, Vector Search, LLM)
  career-ai-service:
    build:
      context: ./services/career-ai-service
      dockerfile: Dockerfile
    container_name: smartcampus-career-ai
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-3.1-flash-lite
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - ATTENDANCE_SERVICE_URL=http://attendance-service:8000
    volumes:
      - career-data:/app/data
    depends_on:
      - attendance-service
    restart: unless-stopped

  # 3. Unified Web Portal (React + Vite + Tailwind)
  web-portal:
    build:
      context: ./web-portal
      dockerfile: Dockerfile
    container_name: smartcampus-web-portal
    ports:
      - "5173:80"
    environment:
      - VITE_ATTENDANCE_API_URL=http://localhost:8000/api/v1
      - VITE_CAREER_API_URL=http://localhost:8001/api
    depends_on:
      - attendance-service
      - career-ai-service
    restart: unless-stopped

volumes:
  attendance-data:
  career-data:
