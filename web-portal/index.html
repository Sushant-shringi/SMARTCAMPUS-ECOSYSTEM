<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Smart Campus Ecosystem — Unified Academic Management, BLE Proximity Attendance & AI Career Assistant" />
    <link rel="manifest" href="/manifest.json" />
    <title>Smart Campus Ecosystem — Academic & AI Career Platform</title>

    <!-- Zero-flash Theme Bootstrapper -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('smartcampus_theme') || localStorage.getItem('smartattend_theme');
          var theme = saved;
          var validThemes = ['university-blue', 'midnight-dark', 'lavender-ai', 'glass-blue', 'career-gradient'];
          if (saved === 'dark') theme = 'midnight-dark';
          else if (saved === 'light') theme = 'university-blue';
          else if (!saved || validThemes.indexOf(saved) === -1) {
            theme = 'university-blue';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'midnight-dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
